<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流浪動物之家中途空間 - 貓咪檔案管理系統</title>
    <!-- 引入 Tailwind CSS 進行精美排版 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- 引入 FontAwesome 圖標 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 隱藏原生檔案上傳按鈕 */
        .file-input-hide {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen pb-12">

    <!-- 頂部導覽列與模式切換 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-pink-500 text-white p-2.5 rounded-2xl shadow-md shadow-pink-200">
                    <i class="fa-solid fa-cat text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide text-slate-800">幸福中途空間</h1>
                    <p class="text-xs text-slate-500">浪愛定格 · 尋找一個永遠的家</p>
                </div>
            </div>
            
            <!-- 模式切換按鈕 (優化測試體驗) -->
            <div class="bg-slate-100 p-1 rounded-xl flex border border-slate-200">
                <button id="btn-admin" onclick="switchMode('admin')" class="px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 bg-white text-pink-600 shadow-sm flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square"></i> 管理者模式 (編輯)
                </button>
                <button id="btn-visitor" onclick="switchMode('visitor')" class="px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 text-slate-600 hover:text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-eye"></i> 訪客模式 (精簡看貓)
                </button>
            </div>
        </div>
    </header>

    <!-- 主體內容區塊 -->
    <main class="max-w-7xl mx-auto px-4 mt-8">
        
        <!-- 提示區塊 -->
        <div id="mode-tip" class="mb-6 bg-blue-50 border border-blue-200 text-blue-700 px-4 py-3 rounded-xl flex items-center gap-3 text-sm">
            <i class="fa-solid fa-circle-info text-base shrink-0"></i>
            <span><strong>當前為【管理者模式】：</strong> 您可以自由填寫、勾選以下欄位並上傳生活照。點擊上方可切換為【訪客模式】觀看最終呈現效果（未勾選項目會自動隱藏）。</span>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- 左側：核心資料卡片 (主欄位 + 基本醫療) -->
            <div class="lg:col-span-5 space-y-6">
                
                <!-- 區塊一：主欄位卡片 -->
                <section class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden transition-all duration-300 hover:shadow-md">
                    <div class="p-6 bg-gradient-to-r from-pink-500 to-rose-500 text-white">
                        <h2 class="text-lg font-bold flex items-center gap-2"><i class="fa-solid fa-id-card"></i> 貓咪主檔案</h2>
                        <p class="text-xs opacity-80 mt-0.5">核心識別資訊與入所時間</p>
                    </div>
                    
                    <div class="p-6 space-y-5">
                        <!-- 照片上傳區 -->
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">大頭照分享</label>
                            <div class="relative group border-2 border-dashed border-slate-300 rounded-2xl h-48 bg-slate-50 flex flex-col justify-center items-center overflow-hidden transition-colors hover:border-pink-400">
                                <img id="main-avatar-preview" class="w-full h-full object-cover hidden" />
                                <div id="main-avatar-placeholder" class="text-center p-4">
                                    <i class="fa-solid fa-cloud-arrow-up text-3xl text-slate-400 group-hover:text-pink-500 transition-colors mb-2"></i>
                                    <p class="text-sm font-medium text-slate-600">點擊上傳或拖曳照片</p>
                                    <p class="text-xs text-slate-400 mt-1">支援 JPG, PNG 格式</p>
                                </div>
                                <input type="file" accept="image/*" onchange="previewMainAvatar(this)" class="file-input-hide admin-field">
                            </div>
                        </div>

                        <!-- 名字與性別 -->
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-1.5">貓咪名字</label>
                                <input type="text" id="cat-name" value="咪咪" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-pink-500/20 focus:border-pink-500 admin-field font-medium">
                                <p id="view-cat-name" class="hidden text-xl font-bold text-slate-800"></p>
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-1.5">性別</label>
                                <div class="admin-field flex bg-slate-100 p-1 rounded-xl border border-slate-200">
                                    <label class="flex-1 text-center py-1.5 rounded-lg text-sm font-medium cursor-pointer transition-all has-[:checked]:bg-white has-[:checked]:text-blue-600 has-[:checked]:shadow-xs">
                                        <input type="radio" name="gender" value="公" checked class="sr-only"> 帥哥 (公)
                                    </label>
                                    <label class="flex-1 text-center py-1.5 rounded-lg text-sm font-medium cursor-pointer transition-all has-[:checked]:bg-white has-[:checked]:text-pink-600 has-[:checked]:shadow-xs">
                                        <input type="radio" name="gender" value="母" class="sr-only"> 美女 (母)
                                    </label>
                                </div>
                                <p id="view-gender" class="hidden text-sm mt-2 font-medium"></p>
                            </div>
                        </div>

                        <!-- 日期時間 -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 border-t border-slate-100 pt-4">
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-1.5">何時進入中途</label>
                                <input type="date" id="date-join" value="2026-01-15" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500/20 focus:border-pink-500 admin-field">
                                <div id="view-date-join" class="hidden text-slate-600 text-sm flex items-center gap-2"><i class="fa-regular fa-calendar text-slate-400"></i> <span></span></div>
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-1.5">何時找到家</label>
                                <input type="date" id="date-home" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500/20 focus:border-pink-500 admin-field">
                                <div id="view-date-home" class="hidden text-slate-600 text-sm flex items-center gap-2"><i class="fa-solid fa-house-chimney text-emerald-500"></i> <span></span></div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 區塊二：基礎三項健康指標 -->
                <section class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 space-y-4">
                    <h2 class="text-base font-bold text-slate-800 flex items-center gap-2 border-b border-slate-100 pb-3"><i class="fa-solid fa-heart-pulse text-emerald-500"></i> 基礎醫療預防</h2>
                    <div class="grid grid-cols-3 gap-3">
                        <!-- 驅蟲 -->
                        <label class="admin-field border border-slate-200 rounded-2xl p-3 text-center cursor-pointer transition-all hover:bg-slate-50 flex flex-col items-center gap-1.5 has-[:checked]:border-emerald-500 LindaCheck shadow-xs">
                            <input type="checkbox" id="chk-parasite" checked class="rounded text-emerald-600 focus:ring-emerald-500">
                            <span class="text-sm font-semibold text-slate-700">體內外驅蟲</span>
                        </label>
                        <!-- 疫苗 -->
                        <label class="admin-field border border-slate-200 rounded-2xl p-3 text-center cursor-pointer transition-all hover:bg-slate-50 flex flex-col items-center gap-1.5 has-[:checked]:border-emerald-500 LindaCheck shadow-xs">
                            <input type="checkbox" id="chk-vaccine" checked class="rounded text-emerald-600 focus:ring-emerald-500">
                            <span class="text-sm font-semibold text-slate-700">核心疫苗</span>
                        </label>
                        <!-- 結紮 -->
                        <label class="admin-field border border-slate-200 rounded-2xl p-3 text-center cursor-pointer transition-all hover:bg-slate-50 flex flex-col items-center gap-1.5 has-[:checked]:border-emerald-500 LindaCheck shadow-xs">
                            <input type="checkbox" id="chk-ligation" class="rounded text-emerald-600 focus:ring-emerald-500">
                            <span class="text-sm font-semibold text-slate-700">絕育結紮</span>
                        </label>
                    </div>
                    <!-- 訪客視角呈現基礎健康 -->
                    <div id="view-basic-health" class="hidden flex flex-wrap gap-2"></div>
                </section>
            </div>

            <!-- 右側：特殊疾病(50種) + 個性(30種) + 日常照片分享區 -->
            <div class="lg:col-span-7 space-y-6">
                
                <!-- 區塊三：特殊疾病篩選區 (精準提供50種) -->
                <section class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6">
                    <div class="flex justify-between items-center border-b border-slate-100 pb-3 mb-4">
                        <h2 class="text-base font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-notes-medical text-amber-500"></i> 特殊健康/疾病狀況檔案 <span class="text-xs text-slate-400 font-normal">(無則免勾)</span></h2>
                    </div>
                    
                    <!-- 50種疾病多選清單 (管理者介面) -->
                    <div id="disease-container" class="admin-field grid grid-cols-2 sm:grid-cols-3 gap-2 max-h-60 overflow-y-auto pr-2 text-sm">
                        <!-- JavaScript 將自動在此注入 50 種疾病項目 -->
                    </div>

                    <!-- 訪客唯讀介面 -->
                    <div id="view-disease-container" class="hidden">
                        <div id="view-disease-list" class="flex flex-wrap gap-2"></div>
                        <p id="view-disease-empty" class="text-sm text-slate-500 bg-slate-50 border border-slate-100 rounded-xl p-3 text-center italic hidden"><i class="fa-solid fa-star text-amber-400 mr-1"></i> 這是一隻非常健康的健康寶寶唷！</p>
                    </div>
                </section>

                <!-- 區塊四：個性特徵篩選區 (精準提供30種) -->
                <section class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6">
                    <div class="border-b border-slate-100 pb-3 mb-4">
                        <h2 class="text-base font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-tags text-indigo-500"></i> 個性特徵特寫 <span class="text-xs text-slate-400 font-normal">(可複選)</span></h2>
                    </div>

                    <!-- 30種個性多選清單 (管理者介面) -->
                    <div id="personality-container" class="admin-field flex flex-wrap gap-2 text-sm">
                        <!-- JavaScript 將自動在此注入 30 種個性特徵 -->
                    </div>

                    <!-- 訪客唯讀介面 -->
                    <div id="view-personality-container" class="hidden">
                        <div id="view-personality-list" class="flex flex-wrap gap-2"></div>
                    </div>
                </section>

                <!-- 區塊五：貓咪日常點滴生活分享區 -->
                <section class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6">
                    <div class="border-b border-slate-100 pb-3 mb-4">
                        <h2 class="text-base font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-camera-retro text-pink-500"></i> 貓咪生活日常照分享區</h2>
                        <p class="text-xs text-slate-400 mt-0.5">記錄毛孩在中途最真實可愛的日常點滴</p>
                    </div>

                    <!-- 管理者動態新增上傳區塊 -->
                    <div id="admin-gallery-zone" class="admin-field space-y-4">
                        <button type="button" onclick="addGalleryItem()" class="w-full py-2.5 border-2 border-dashed border-indigo-300 rounded-xl text-sm font-semibold text-indigo-600 bg-indigo-50/50 hover:bg-indigo-50 transition-colors flex items-center justify-center gap-2 cursor-pointer">
                            <i class="fa-solid fa-plus"></i> 新增一筆生活相簿紀錄
                        </button>
                        
                        <!-- 動態照片卡片容器 -->
                        <div id="gallery-inputs-list" class="space-y-4"></div>
                    </div>

                    <!-- 訪客精美瀑布流/卡片展示區 -->
                    <div id="view-gallery-zone" class="hidden grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <!-- 動態渲染訪客照片牆 -->
                    </div>
                </section>

            </div>
        </div>
    </main>

    <!-- 核心運作 JavaScript -->
    <script>
        // 1. 精準定義 50 種特殊疾病/健康狀況描述，分為六大類
        const categories = [
            { cat: "呼吸與感官", list: ["貓上呼吸道感染(感冒)", "慢性鼻炎", "貓皰疹病毒(FHV-1)", "卡里西病毒(FCV)", "結膜炎", "角膜潰瘍", "中耳炎", "失明/視力受損", "失聰/聽力受損"] },
            { cat: "傳染與免疫", list: ["貓愛滋(FIV+)", "貓白血病(FeLV+)", "傳染性腹膜炎(FIP已治癒)", "傳染性腹膜炎(FIP治療中)", "貓瘟康復期", "弓形蟲感染"] },
            { cat: "消化與內分泌", list: ["慢性腎臟病(CKD)", "下泌尿道症候群(FIC)", "尿道結石", "糖尿病", "甲狀腺功能亢進", "慢性胰臟炎", "炎症性腸病(IBD)", "巨結腸症(便秘)"] },
            { cat: "皮膚與毛髮", list: ["貓癬/黴菌感染", "毛囊炎(黑下巴)", "疥癬蟲感染", "過敏性皮膚炎", "跳蚤過敏性吸吮", "嗜酸性肉芽腫"] },
            { cat: "口腔與骨骼", list: ["口炎/嚴重牙齦炎", "全口拔牙後續護理", "牙結石/需洗牙", "骨折康復中", "退化性關節炎", "髖關節發育不良", "髕骨外翻", "截肢/肢體殘缺"] },
            { cat: "其他與高齡護理", list: ["心臟肥大(HCM)", "癲癇歷史", "貧血", "過胖/需體重控制", "過瘦/需加強營養", "隱睪症", "懷孕中/哺乳中", "化療中", "行為性自殘/過度舔毛", "認知障礙(失智症)", "有藥物過敏史", "需定時灌餵食", "需每日定時投藥"] }
        ];

        // 扁平化50種疾病名稱陣列
        const diseaseList = [];
        categories.forEach(c => diseaseList.push(...c.list));

        // 2. 精準定義 30 種個性特徵
        const personalityList = [
            "親人黏人", "獨立自主", "溫柔沉穩", "活潑好動", "愛撒嬌", 
            "慢熟害羞", "膽小敏感", "好奇心旺盛", "貪吃鬼", "愛說話/話嘮", 
            "呼嚕機關槍", "天使貓咪", "精力充沛", "喜歡玩玩具", "喜好高處", 
            "貓老大性格", "隨和好相處", "愛乾淨", "容易被嚇到", "喜歡曬太陽",
            "適應力強", "慢郎中", "有點小傲嬌", "喜歡看窗外", "踏踏高手",
            "親狗傾向", "親貓友善", "適合單貓家庭", "適合多貓家庭", "需要耐心陪伴"
        ];

        // 頁面初始化
        document.addEventListener("DOMContentLoaded", function() {
            renderDiseaseInputs();
            renderPersonalityInputs();
            
            // 預設建立一組日常相簿欄位
            addGalleryItem();
        });

        // 渲染 50 種疾病勾選格
        function renderDiseaseInputs() {
            const container = document.getElementById("disease-container");
            container.innerHTML = "";
            diseaseList.forEach((disease, index) => {
                const div = document.createElement("label");
                div.className = "flex items-start gap-2 p-1.5 rounded-lg hover:bg-slate-50 cursor-pointer transition-colors";
                div.innerHTML = `
                    <input type="checkbox" value="${disease}" class="disease-checkbox mt-0.5 rounded text-amber-500 focus:ring-amber-500">
                    <span class="text-slate-700 leading-tight">${disease}</span>
                `;
                container.appendChild(div);
            });
        }

        // 渲染 30 種個性勾選格
        function renderPersonalityInputs() {
            const container = document.getElementById("personality-container");
            container.innerHTML = "";
            personalityList.forEach((trait, index) => {
                const label = document.createElement("label");
                label.className = "px-3 py-1.5 rounded-xl border border-slate-200 text-slate-700 bg-slate-50 font-medium cursor-pointer transition-all hover:bg-indigo-50 hover:border-indigo-300 has-[:checked]:bg-indigo-600 has-[:checked]:text-white has-[:checked]:border-indigo-600 has-[:checked]:shadow-xs select-none";
                label.innerHTML = `
                    <input type="checkbox" value="${trait}" class="personality-checkbox sr-only">
                    <span>${trait}</span>
                `;
                container.appendChild(label);
            });
        }

        // 主頭像預覽
        function previewMainAvatar(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById("main-avatar-preview").src = e.target.result;
                    document.getElementById("main-avatar-preview").classList.remove("hidden");
                    document.getElementById("main-avatar-placeholder").classList.add("hidden");
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        // 動態新增日常照表單欄位
        let galleryCounter = 0;
        function addGalleryItem() {
            galleryCounter++;
            const listContainer = document.getElementById("gallery-inputs-list");
            
            const card = document.createElement("div");
            card.id = `gallery-item-${galleryCounter}`;
            card.className = "gallery-input-card bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-3 relative";
            card.innerHTML = `
                <button type="button" onclick="removeGalleryItem(${galleryCounter})" class="absolute top-3 right-3 text-slate-400 hover:text-rose-500 text-sm transition-colors cursor-pointer">
                    <i class="fa-regular fa-trash-can"></i> 刪除
                </button>
                <div class="grid grid-cols-1 sm:grid-cols-12 gap-4">
                    <div class="sm:col-span-4">
                        <div class="relative border-2 border-dashed border-slate-300 rounded-xl h-28 bg-white flex flex-col justify-center items-center overflow-hidden group hover:border-pink-400 transition-colors">
                            <img id="gallery-preview-${galleryCounter}" class="w-full h-full object-cover hidden" />
                            <div id="gallery-holder-${galleryCounter}" class="text-center p-2">
                                <i class="fa-solid fa-images text-xl text-slate-400 group-hover:text-pink-500"></i>
                                <span class="block text-xs font-medium text-slate-500 mt-1">選取相片</span>
                            </div>
                            <input type="file" accept="image/*" onchange="previewGalleryImage(this, ${galleryCounter})" class="file-input-hide gallery-img-file">
                        </div>
                    </div>
                    <div class="sm:col-span-8 flex flex-col justify-between">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">日常點滴敘述</label>
                            <textarea rows="3" placeholder="例如：咪咪今天第一次主動翻肚子討摸摸，呼嚕聲超級大聲，看來已經完全適應這裡的生活囉！" class="gallery-text-desc w-full px-3 py-1.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500/20 focus:border-pink-500 resize-none"></textarea>
                        </div>
                    </div>
                </div>
            `;
            listContainer.appendChild(card);
        }

        function removeGalleryItem(id) {
            const item = document.getElementById(`gallery-item-${id}`);
            if (item) item.remove();
        }

        // 日常照預覽功能
        function previewGalleryImage(input, id) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById(`gallery-preview-${id}`).src = e.target.result;
                    document.getElementById(`gallery-preview-${id}`).classList.remove("hidden");
                    document.getElementById(`gallery-holder-${id}`).classList.add("hidden");
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        // 核心切換模式：管理者（輸入） V.S. 訪客（唯讀美化展示）
        function switchMode(mode) {
            const btnAdmin = document.getElementById("btn-admin");
            const btnVisitor = document.getElementById("btn-visitor");
            const modeTip = document.getElementById("mode-tip");
            
            // 找出所有填寫、勾選欄位
            const adminFields = document.querySelectorAll(".admin-field");
            
            if (mode === 'visitor') {
                // 1. 切換按電樣式
                btnAdmin.className = "px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 text-slate-600 hover:text-slate-900 flex items-center gap-2";
                btnVisitor.className = "px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 bg-white text-pink-600 shadow-sm flex items-center gap-2";
                
                modeTip.className = "mb-6 bg-emerald-50 border border-emerald-200 text-emerald-700 px-4 py-3 rounded-xl flex items-center gap-3 text-sm";
                modeTip.innerHTML = `<i class="fa-solid fa-circle-check text-base shrink-0"></i> <span><strong>當前為【訪客模式】：</strong> 網頁已進行最優化排版，未勾選的疾病、特徵皆已自動隱藏，呈現最精準乾淨的畫面！</span>`;

                // 2. 隱藏編輯輸入元件
                adminFields.forEach(f => f.classList.add("hidden"));

                // 3. 處理訪客唯讀資料轉單同步
                syncDataToVisitorView();

            } else {
                // 切回管理者模式
                btnAdmin.className = "px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 bg-white text-pink-600 shadow-sm flex items-center gap-2";
                btnVisitor.className = "px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 text-slate-600 hover:text-slate-900 flex items-center gap-2";
                
                modeTip.className = "mb-6 bg-blue-50 border border-blue-200 text-blue-700 px-4 py-3 rounded-xl flex items-center gap-3 text-sm";
                modeTip.innerHTML = `<i class="fa-solid fa-circle-info text-base shrink-0"></i> <span><strong>當前為【管理者模式】：</strong> 您可以自由填寫、勾選以下欄位並上傳生活照。點擊上方可切換為【訪客模式】觀看最終呈現效果（未勾選項目會自動隱藏）。</span>`;

                // 顯示編輯輸入元件
                adminFields.forEach(f => f.classList.remove("hidden"));
                
                // 隱藏訪客唯讀專用容器
                document.getElementById("view-cat-name").classList.add("hidden");
                document.getElementById("view-gender").classList.add("hidden");
                document.getElementById("view-date-join").classList.add("hidden");
                document.getElementById("view-date-home").classList.add("hidden");
                document.getElementById("view-basic-health").classList.add("hidden");
                document.getElementById("view-disease-container").classList.add("hidden");
                document.getElementById("view-personality-container").classList.add("hidden");
                document.getElementById("view-gallery-zone").classList.add("hidden");
            }
        }

        // 將輸入的資料同步到訪客唯讀畫面（核心邏輯：只顯示被勾選的）
        function syncDataToVisitorView() {
            // 1. 同步名字
            const name = document.getElementById("cat-name").value || "未命名";
            const viewName = document.getElementById("view-cat-name");
            viewName.textContent = name;
            viewName.classList.remove("hidden");

            // 2. 同步性別標籤
            const genderVal = document.querySelector('input[name="gender"]:checked').value;
            const viewGender = document.getElementById("view-gender");
            if(genderVal === '公') {
                viewGender.className = "inline-block text-xs bg-blue-50 text-blue-600 px-2.5 py-1 rounded-full font-bold";
                viewGender.innerHTML = `<i class="fa-solid fa-mars"></i> 帥哥 (${genderVal})`;
            } else {
                viewGender.className = "inline-block text-xs bg-pink-50 text-pink-600 px-2.5 py-1 rounded-full font-bold";
                viewGender.innerHTML = `<i class="fa-solid fa-venus"></i> 美女 (${genderVal})`;
            }
            viewGender.classList.remove("hidden");

            // 3. 同步日期進出時間
            const dateJoin = document.getElementById("date-join").value;
            const viewJoin = document.getElementById("view-date-join");
            if(dateJoin) {
                viewJoin.querySelector("span").textContent = `入所日期：${dateJoin}`;
                viewJoin.classList.remove("hidden");
            }

            const dateHome = document.getElementById("date-home").value;
            const viewHome = document.getElementById("view-date-home");
            if(dateHome) {
                viewHome.querySelector("span").textContent = `恭喜畢業：${dateHome}`;
                viewHome.classList.remove("hidden");
            } else {
                viewHome.querySelector("span").textContent = `等待一個家...`;
                viewHome.classList.remove("hidden");
            }

            // 4. 同步基礎醫療預防
            const basicHealth = document.getElementById("view-basic-health");
            basicHealth.innerHTML = "";
            const healthChecks = [
                { id: "chk-parasite", label: "已體內外驅蟲", icon: "fa-bug-slash", color: "bg-teal-50 text-teal-700 border-teal-200" },
                { id: "chk-vaccine", label: "已施打核心疫苗", icon: "fa-syringe", color: "bg-emerald-50 text-emerald-700 border-emerald-200" },
                { id: "chk-ligation", label: "已完成絕育手術", icon: "fa-scissors", color: "bg-sky-50 text-sky-700 border-sky-200" }
            ];
            healthChecks.forEach(item => {
                const isChecked = document.getElementById(item.id).checked;
                // 不管有沒有勾選，在訪客端都精美呈現狀態
                const badge = document.createElement("span");
                badge.className = `text-xs border px-3 py-1.5 rounded-xl font-medium flex items-center gap-1.5 ${isChecked ? item.color : 'bg-slate-100 text-slate-400 border-slate-200 line-through'}`;
                badge.innerHTML = `<i class="fa-solid ${isChecked ? item.icon : 'fa-circle-xmark'}"></i> ${item.label}`;
                basicHealth.appendChild(badge);
            });
            basicHealth.classList.remove("hidden");

            // 5. 【關鍵需求】智慧篩選：只顯示被勾選的特殊疾病
            const viewDiseaseContainer = document.getElementById("view-disease-container");
            const viewDiseaseList = document.getElementById("view-disease-list");
            const viewDiseaseEmpty = document.getElementById("view-disease-empty");
            
            viewDiseaseList.innerHTML = "";
            viewDiseaseContainer.classList.remove("hidden");
            
            const selectedDiseases = Array.from(document.querySelectorAll(".disease-checkbox:checked")).map(el => el.value);
            
            if(selectedDiseases.length === 0) {
                viewDiseaseEmpty.classList.remove("hidden");
            } else {
                viewDiseaseEmpty.classList.add("hidden");
                selectedDiseases.forEach(d => {
                    const dBadge = document.createElement("span");
                    dBadge.className = "text-xs bg-amber-50 text-amber-800 border border-amber-200 px-3 py-1.5 rounded-xl font-medium flex items-center gap-1";
                    dBadge.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-amber-500"></i> ${d}`;
                    viewDiseaseList.appendChild(dBadge);
                });
            }

            // 6. 【關鍵需求】智慧篩選：只顯示被勾選的個性標籤
            const viewPersonalityContainer = document.getElementById("view-personality-container");
            const viewPersonalityList = document.getElementById("view-personality-list");
            
            viewPersonalityList.innerHTML = "";
            viewPersonalityContainer.classList.remove("hidden");
            
            const selectedTraits = Array.from(document.querySelectorAll(".personality-checkbox:checked")).map(el => el.value);
            
            if(selectedTraits.length === 0) {
                viewPersonalityList.innerHTML = `<p class="text-xs text-slate-400 italic">正在用心發掘獨特個性中...</p>`;
            } else {
                selectedTraits.forEach(t => {
                    const tBadge = document.createElement("span");
                    tBadge.className = "text-xs bg-indigo-50 text-indigo-700 border border-indigo-100 px-3 py-1.5 rounded-xl font-semibold shadow-xs";
                    tBadge.textContent = `# ${t}`;
                    viewPersonalityList.appendChild(tBadge);
                });
            }

            // 7. 同步與渲染日常照片分享專區
            const viewGalleryZone = document.getElementById("view-gallery-zone");
            viewGalleryZone.innerHTML = "";
            viewGalleryZone.classList.remove("hidden");

            const inputCards = document.querySelectorAll(".gallery-input-card");
            let hasValidPhotos = false;

            inputCards.forEach(card => {
                const imgFileEl = card.querySelector(".gallery-img-file");
                const descText = card.querySelector(".gallery-text-desc").value.trim();
                
                // 取得預覽圖的原生 Base64 或記憶體路徑
                const imgPreviewEl = card.querySelector("img");
                const imgSrc = imgPreviewEl && !imgPreviewEl.classList.contains("hidden") ? imgPreviewEl.src : "";

                if (imgSrc || descText) {
                    hasValidPhotos = true;
                    const galleryCard = document.createElement("div");
                    galleryCard.className = "bg-slate-50 border border-slate-200 rounded-2xl overflow-hidden shadow-xs transition-transform duration-200 hover:-translate-y-0.5";
                    
                    // 如果有照片就顯示，沒上傳照片則用好看的暖色貓咪貓掌預設底圖代替
                    const displayImg = imgSrc ? imgSrc : 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 24 24" fill="%23f1f5f9"><path d="M12 14c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zm0-12C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15.92c-.33.05-.66.08-1 .08s-.67-.03-1-.08v-1.12c.33.05.66.08 1 .08s.67-.03 1-.08v1.12z"/></svg>';

                    galleryCard.innerHTML = `
                        <div class="h-44 bg-slate-200 relative overflow-hidden flex items-center justify-center">
                            <img src="${displayImg}" class="w-full h-full object-cover">
                            ${!imgSrc ? '<div class="absolute inset-0 flex items-center justify-center text-slate-400 text-xs font-medium"><i class="fa-solid fa-paw mr-1"></i> 生活動態觀察中</div>' : ''}
                        </div>
                        <div class="p-4 bg-white">
                            <p class="text-sm text-slate-700 leading-relaxed font-normal">${descText ? descText : '這天小貓咪開心地探索中途家園，雖然沒有留下文字文字，但快樂的心情溢於言表！'}</p>
                            <div class="mt-3 pt-2 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
                                <span><i class="fa-solid fa-heart text-pink-400"></i> 日常紀錄點滴</span>
                                <span>幸福中途</span>
                            </div>
                        </div>
                    `;
                    viewGalleryZone.appendChild(galleryCard);
                }
            });

            if (!hasValidPhotos) {
                viewGalleryZone.className = "block text-center p-8 border border-dashed border-slate-200 rounded-2xl text-slate-400 text-sm italic";
                viewGalleryZone.innerHTML = `<i class="fa-solid fa-camera text-2xl mb-1.5 block"></i> 還沒有上傳生活照，持續記錄中！`;
            } else {
                viewGalleryZone.className = "grid grid-cols-1 sm:grid-cols-2 gap-4";
            }
        }
    </script>
</body>
</html>
