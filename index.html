<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浪貓不浪 - 浪愛定格，尋找溫暖的家</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans pb-16">

    <header class="bg-white border-b border-slate-100 shadow-xs sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2.5 cursor-pointer" onclick="showView('gallery-view')">
                <div class="bg-orange-500 text-white p-2 rounded-xl"><i class="fa-solid fa-cat text-xl"></i></div>
                <div>
                    <h1 class="text-lg font-bold tracking-wide">浪貓不浪</h1>
                    <p class="text-[10px] text-slate-400">流浪動物中途寵物空間</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <button onclick="openModal('owner-login-modal')" class="px-3.5 py-1.5 border border-slate-200 text-slate-600 rounded-xl text-xs font-medium hover:bg-slate-50 transition-colors">
                    <i class="fa-solid fa-house-user mr-1 text-orange-500"></i>飼主登入
                </button>
                <button onclick="openModal('backend-login-modal')" class="px-3.5 py-1.5 bg-slate-900 text-white rounded-xl text-xs font-medium hover:bg-slate-800 transition-colors">
                    <i class="fa-solid fa-screwdriver-wrench mr-1"></i>後台登入
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 mt-8">
        
        <div class="flex border-b border-slate-200 mb-6 gap-6 text-sm font-medium">
            <button id="tab-gallery" onclick="switchMainTab('gallery')" class="pb-3 border-b-2 border-orange-500 text-orange-600 font-bold">中途貓咪大廳</button>
            <button id="tab-happy" onclick="switchMainTab('happy')" class="pb-3 border-b-2 border-transparent text-slate-500 hover:text-slate-800">找到幸福貓咪分享區</button>
        </div>

        <div id="current-role-badge" class="hidden mb-4 bg-orange-50 border border-orange-100 text-orange-800 px-4 py-2.5 rounded-xl text-xs flex justify-between items-center">
            <span>當前身分：<strong id="role-text">訪客</strong></span>
            <button onclick="logoutRole()" class="text-red-500 hover:underline font-bold">登出身分</button>
        </div>

        <div id="gallery-view" class="space-y-6">
            <div id="cats-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="col-span-full text-center py-12 text-slate-400 italic">正在從雲端載入貓咪夥伴們...</div>
            </div>
        </div>

        <div id="detail-view" class="hidden space-y-6">
            <button onclick="showView('gallery-view')" class="text-sm font-medium text-slate-600 hover:text-slate-900 flex items-center gap-1.5"><i class="fa-solid fa-arrow-left"></i> 返回貓咪大廳</button>
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <div class="lg:col-span-4 space-y-4">
                    <div class="bg-white border border-slate-200 rounded-3xl overflow-hidden p-4 text-center">
                        <img id="detail-avatar" src="" class="w-full h-56 object-cover rounded-2xl bg-slate-100 mb-4">
                        <h2 id="detail-name" class="text-xl font-bold"></h2>
                        <p id="detail-no" class="text-xs text-slate-400 mt-1"></p>
                        <div id="detail-status-badge" class="mt-3 inline-block px-3 py-1 rounded-full text-xs font-bold"></div>
                    </div>
                </div>
                <div class="lg:col-span-8 space-y-4">
                    <div class="bg-white border border-slate-200 rounded-3xl p-6 space-y-4">
                        <h3 class="font-bold border-b border-slate-100 pb-2"><i class="fa-solid fa-notes-medical text-teal-500 mr-1"></i> 健康與醫療紀錄</h3>
                        <div id="detail-basic-health" class="flex flex-wrap gap-2"></div>
                        <div id="detail-diseases" class="flex flex-wrap gap-2 pt-2"></div>
                        
                        <h3 class="font-bold border-b border-slate-100 pb-2 pt-4"><i class="fa-solid fa-tags text-indigo-500 mr-1"></i> 特有個性標籤</h3>
                        <div id="detail-personalities" class="flex flex-wrap gap-2"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="happy-view" class="hidden space-y-6">
            <div id="owner-post-box" class="hidden bg-amber-50/50 border border-amber-200 rounded-2xl p-5 space-y-3">
                <h3 class="text-sm font-bold text-amber-900"><i class="fa-solid fa-feather-pointed mr-1"></i> 新增幸福近況回報</h3>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <input type="text" id="post-cat-name" placeholder="貓咪現在的名字" class="sm:col-span-1 px-3 py-2 bg-white border border-slate-300 rounded-xl text-xs focus:outline-none">
                    <input type="file" id="post-photo" accept="image/*" class="sm:col-span-2 text-xs file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-orange-50 file:text-orange-700 hover:file:bg-orange-100">
                </div>
                <textarea id="post-text" rows="3" placeholder="和中途媽媽、志工們分享毛孩在家裡的爽爽過生活點滴吧！" class="w-full px-3 py-2 bg-white border border-slate-300 rounded-xl text-xs focus:outline-none resize-none"></textarea>
                <button onclick="submitHappyPost()" class="px-4 py-2 bg-orange-500 text-white rounded-xl text-xs font-bold hover:bg-orange-600 transition-colors">公開發布近況</button>
            </div>

            <div id="happy-stories-list" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </div>

        <div id="admin-panel-view" class="hidden space-y-6">
            <div class="bg-white border border-slate-200 rounded-3xl p-6">
                <div class="flex justify-between items-center border-b border-slate-100 pb-4 mb-4">
                    <div>
                        <h2 class="text-base font-bold">🛠️ 系統管理後台</h2>
                        <p class="text-xs text-slate-400 mt-0.5">進行中途毛孩建檔與認養人權限發放</p>
                    </div>
                    <button id="btn-mgr-owners" onclick="openOwnerManagerModal()" class="hidden px-3 py-1.5 bg-indigo-600 text-white rounded-xl text-xs font-semibold hover:bg-indigo-700">管理飼主帳號</button>
                </div>
